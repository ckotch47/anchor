[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anchor"
version = "0.1.0"
description = "Local CLI tool for agents with compact retrieval and SQLite storage."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12,<1.0",
  "pydantic>=2.7,<3.0",
  "openai>=1.40,<2.0",
  "mcp>=1.27,<2.0",
  "sqliteai-vector>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2.0",
  "ruff>=0.6,<1.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF"]
ignore = ["E501"]

[project.scripts]
anchor = "anchor.main:main"
anchor-mcp = "anchor.mcp_server:run_stdio"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anchor = ["config.example.toml"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]
