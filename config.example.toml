[runtime]
default_view = "compact"
default_limit = 20
default_project = "workspace"
default_budget_tokens = 800
retry_attempts = 3
busy_timeout_ms = 250
offline_only = true
memory_auto_extract = false
memory_external_send = false
memory_external_projects = []
memory_extract_batch_size = 10
memory_extract_min_interval_seconds = 60

[provider]
base_url = "https://api.example.com/v1"
api_key_env = "OPENAI_API_KEY"
embedding_model = "text-embedding-3-small"
rerank_model = "gpt-5.5"
memory_model = ""

[vector]
dimension = 1536
distance = "cosine"
chunk_size = 400
chunk_overlap = 50

[profiles.default]
view = "compact"
limit = 20

[profiles.full]
view = "full"
limit = 50
