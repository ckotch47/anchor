name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install 'uv==0.9.8'
      - name: Validate lock and install
        run: |
          uv lock --check
          uv sync --frozen --all-groups --extra dev
      - name: Lint
        run: uv run ruff check src tests
      - name: Type check
        run: uv run mypy src/anchor
      - name: Test
        run: uv run pytest -q -W error::ResourceWarning
      - name: Build and smoke wheel
        run: |
          uv build
          python -m venv "$RUNNER_TEMP/anchor-wheel-smoke"
          "$RUNNER_TEMP/anchor-wheel-smoke/bin/pip" install dist/anchor-*.whl
          "$RUNNER_TEMP/anchor-wheel-smoke/bin/anchor" --version
          "$RUNNER_TEMP/anchor-wheel-smoke/bin/anchor" capabilities --format json
      - name: Verify source distribution assets
        if: runner.os == 'Linux' && matrix.python-version == '3.13'
        run: tar -tzf dist/anchor-*.tar.gz | grep -E 'docker-compose.reranker.yml|docs/reranker-compose.md'

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install 'uv==0.9.8' 'pip-audit==2.9.0'
      - run: uv lock --check
      - run: uv export --frozen --no-dev --no-emit-project --output-file "$RUNNER_TEMP/anchor-runtime.txt"
      - run: python -m pip_audit --strict --requirement "$RUNNER_TEMP/anchor-runtime.txt"
      - run: uv export --frozen --no-dev --extra vector --no-emit-project --output-file "$RUNNER_TEMP/anchor-vector.txt"
      - run: python -m pip_audit --strict --requirement "$RUNNER_TEMP/anchor-vector.txt"

  deployment-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: docker compose -f docker-compose.reranker.yml --profile gpu config --quiet
      - run: python tests/validate_deployment_assets.py
